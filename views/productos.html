<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo completo de productos ecológicos en EcoMarket.">
  <title>Catálogo de Productos | EcoMarket</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">🌱 EcoMarket</a>

      <div class="header-actions">
        <a href="productos.html" class="action-link" aria-label="Buscar productos">🔍 Buscar</a>
        <a href="productos.html" class="action-link" aria-label="Ver carrito de compras">🛒 (0)</a>
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Abrir menú de navegación">☰</label>
      </div>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">

      <nav class="main-nav" aria-label="Navegación principal">
        <ul class="nav-list">
          <li><a href="../index.html" class="nav-link">Inicio</a></li>
          <li><a href="productos.html" class="nav-link active">Productos</a></li>
          <li><a href="sobre-nosotros.html" class="nav-link">Nosotros</a></li>
          <li><a href="contacto.html" class="nav-link">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section-padding">
    <div class="container">
      <h1 class="section-title">Catálogo Ecológico</h1>

<!-- Barra Superior: Buscador visual estilizado -->
      <div class="search-bar-container">
        <input type="search" class="search-input" placeholder="Buscar por nombre, material o categoría..." aria-label="Buscar en el catálogo">
        <button type="button" class="btn btn-primary">Buscar</button>
      </div>

      <div class="catalog-layout">
        <!-- Sidebar de Filtros (Sticky) -->
        <aside class="filter-sidebar" aria-label="Filtros de catálogo">
          <div class="filter-group">
            <h3>Categorías</h3>
            <ul class="filter-list">
              <li><label><input type="checkbox" checked> Hogar (6)</label></li>
              <li><label><input type="checkbox" checked> Moda (4)</label></li>
              <li><label><input type="checkbox" checked> Cuidado Personal (6)</label></li>
              <li><label><input type="checkbox" checked> Alimentos (4)</label></li>
            </ul>
          </div>

          <div class="filter-group">
            <h3>Rango de Precios</h3>
            <input type="range" min="5000" max="150000" value="95000" class="range-slider" aria-label="Rango de precios">
            <p>$5.000 - $150.000 COP</p>
          </div>

          <div class="filter-group">
            <h3>Disponibilidad</h3>
            <ul class="filter-list">
              <li><label><input type="checkbox" checked> En Stock</label></li>
              <li><label><input type="checkbox"> Incluir Agotados</label></li>
            </ul>
          </div>
        </aside>

<!-- Grid de 20 Productos (4 cols Desktop -> 2 cols Tablet -> 1 col Móvil) -->
        <section>
          <div class="products-grid">
            <!-- 1 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <span class="badge badge-stock">En Stock</span>
                <div class="fav-wrapper"><input type="checkbox" id="f1" class="fav-checkbox"><label for="f1" class="btn-fav" title="Favorito">♥</label></div>
                <img src="../img/products/prod-1.jpg" alt="Cepillo Dental de Bambú">
              </div>
              <div class="product-body">
                <h3>Cepillo Dental de Bambú</h3>
                <p class="product-price">$12.000</p>
                <a href="#f1" class="btn btn-outline">Añadir al carrito</a>
              </div>
            </article>
